name: Vydání

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Závislosti pro ikonu
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials pillow

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Sestavení instalátoru
        run: powershell -ExecutionPolicy Bypass -File tools/build_installer.ps1 -Version ${{ github.ref_name }}

      - name: Ověření, že instalátor existuje
        shell: pwsh
        run: |
          $f = Get-ChildItem dist/voice-pilot-*-setup.exe
          if (-not $f) { throw "instalátor se nevytvořil" }
          "Velikost: {0:N1} MB" -f ($f.Length / 1MB)

      - name: Vydání
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release create ${{ github.ref_name }} dist/voice-pilot-*-setup.exe --generate-notes --title ${{ github.ref_name }}
